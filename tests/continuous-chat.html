<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Embedded meeting conversation</title>
<style>
  :root { color-scheme: light dark; }
  [jsname="o7uNDd"] {
    background-color: light-dark(#f1f3f4, #303030);
    color: light-dark(#202124, #e3e3e3);
    padding: 8px 12px;
    border-radius: 16px;
  }
  [jsname="o7uNDd"] > .DTp27d { color: inherit; }
</style>
<main>
  <div>Meeting messages are synced with a Google Chat conversation.</div>
  <c-wiz data-topic-id="example" data-is-embedded-view="true">
    <span>テスト参加者</span>
    <div jsname="o7uNDd">
      <div jsname="bgckF" class="DTp27d QIJiHb Zc1Emd">窓を開けます。</div>
      <div>既読</div>
    </div>
    <time>10:00</time>
    <div role="textbox" contenteditable="true"><div jsname="bgckF">返信の下書き</div></div>
  </c-wiz>
  <c-wiz data-topic-id="editing">
    <div jsname="bgckF"><div contenteditable="plaintext-only">編集中</div></div>
  </c-wiz>
</main>
<div role="textbox" contenteditable="true">未送信のメッセージ</div>
</html>
